# Every push: build and test, then publish AVABand as a self-contained single-file program for
# every platform Avalonia and .NET support. The builds are attached to the workflow run; pushes to
# main also refresh the "latest" pre-release, and a v* tag (e.g. v0.1.0) makes a proper release.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build AVABand.sln -c Release -warnaserror
      - name: Test
        run: dotnet test AVABand.sln -c Release --no-build

  soak:
    # Long bot-played games at every depth, each recorded and replayed (tools/balance soak): fails on
    # a crash, a hang, or a replay that doesn't end where its game did. Failing replays are kept.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Soak
        run: dotnet run -c Release --project tools/balance soak
      - name: Keep failing replays
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: soak-failures
          path: soak-failures/

  drift:
    # AVABand's game data must match Angband 4.2.5's (tools/compare_with_angband.py); the release
    # is pinned by checksum.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch Angband 4.2.5
        run: |
          curl -sSL -o angband.tar.gz https://github.com/angband/angband/archive/refs/tags/4.2.5.tar.gz
          echo "2a27ce296310c4cbf960e2eb41ef55d383e546f24533446cf224119498a99651  angband.tar.gz" | sha256sum -c -
          tar xzf angband.tar.gz -C "$RUNNER_TEMP"
      - name: Compare with 4.2.5
        run: python3 tools/compare_with_angband.py "$RUNNER_TEMP/angband-4.2.5/lib/gamedata" --out "$RUNNER_TEMP/drift.md" --fail-on-diff
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: angband-4.2.5-data-drift
          path: ${{ runner.temp }}/drift.md

  publish:
    needs: [test, drift, soak]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-x86
          - win-arm64
          - linux-x64
          - linux-arm64
          - linux-arm
          - linux-musl-x64
          - linux-musl-arm64
          - osx-x64
          - osx-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/Angband.Avalonia/Angband.Avalonia.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/${{ matrix.rid }}
      - name: Package
        # Windows gets a zip; everything else a tar.gz, which keeps the executable bit.
        run: |
          mkdir -p artifacts
          cp LICENSE THIRD-PARTY-NOTICES.md README.md publish/${{ matrix.rid }}/
          name="AVABand-${{ matrix.rid }}"
          cd publish/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -9 -r "../../artifacts/$name.zip" .
          else
            chmod +x AVABand
            tar -czf "../../artifacts/$name.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          # Uploaded as-is (no zip around the zip/tar.gz): the artifact is named after the file.
          path: artifacts/AVABand-${{ matrix.rid }}.*
          archive: false
          if-no-files-found: error

  release:
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          # The builds were uploaded as their own .zip/.tar.gz files: keep them that way.
          skip-decompress: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "AVABand $GITHUB_REF_NAME" --generate-notes
          else
            # A rolling pre-release of the newest main build.
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest artifacts/* --prerelease --target "$GITHUB_SHA" \
              --title "Latest build (main)" \
              --notes "Built automatically from ${GITHUB_SHA::7} on main. Unzip or untar and run AVABand (AVABand.exe on Windows)."
          fi
